stages:
  - generate

generate_spapi_models:
  stage: generate
  image: node:22
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never
  before_script:
    - apt-get update -y
    - apt-get install -y git
    - git config user.email "automation@spapi.local"
    - git config user.name "SP-API Model Bot"
  script:
    - node scripts/generate-spapi.js
    - if git diff --quiet; then echo "No model changes"; exit 0; fi
    - git add nodes/AmazonSellingPartner/generated/Generated.description.ts
    - git commit -m "chore: regenerate SP-API models"
    - git push "https://oauth2:${GITLAB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git" HEAD:${CI_COMMIT_BRANCH}
